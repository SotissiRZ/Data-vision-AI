name: datavision

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datavision
      POSTGRES_USER: datavision
      POSTGRES_PASSWORD: datavision
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datavision -d datavision"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped


  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8005:8005"
    networks:
      - default
      - notebook_sandbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8005/health/ready', timeout=4)); sys.exit(0 if d.get('ready') else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  sandbox:
    build: ./sandbox
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=768m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 1g
    cpus: 1.5
    networks:
      - notebook_sandbox
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import redis; from app.core.config import get_settings; r=redis.Redis.from_url(get_settings().redis_url, socket_connect_timeout=2); raise SystemExit(0 if r.ping() else 1)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  migrate:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "-m", "app.ops.migrate", "apply", "--json"]
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backup:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "-m", "app.ops.backup", "create", "--label", "manual"]
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  restore-drill:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "-m", "app.ops.backup", "drill-latest"]
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      OTEL_INTERNAL_METRICS_TOKEN: ${OTEL_INTERNAL_METRICS_TOKEN:-change-this-otel-metrics-token}
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/backend
        INTERNAL_API_URL: http://api:8005/api/v1
    environment:
      NEXT_PUBLIC_API_URL: /api/backend
      INTERNAL_API_URL: http://api:8005/api/v1
      PORT: 3005
    ports:
      - "3005:3005"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3005/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  clamav_data:

networks:
  notebook_sandbox:
    internal: true
