services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datavision
      POSTGRES_USER: datavision
      POSTGRES_PASSWORD: datavision
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datavision"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    build: ./backend
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8005/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8005/api/v1
      PORT: 3005
    ports:
      - "3005:3005"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
