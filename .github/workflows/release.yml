name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cp .env.example .env
      - run: python scripts/repository_hygiene.py --root . --check
      - run: python scripts/dependency_compatibility.py --root . --check
      - run: python scripts/production_baseline.py --check
      - run: python scripts/preparation_acceptance.py --root . --check
      - run: python scripts/workspace_acceptance.py --root . --check
      - run: python scripts/assistant_acceptance.py --root . --check
      - run: python scripts/assistant_window_acceptance.py --root . --check
      - run: python scripts/assistant_context_acceptance.py --root . --check
      - run: python scripts/assistant_multimodal_acceptance.py --root . --check
      - run: python scripts/multi_agent_acceptance.py --root . --check
      - run: python scripts/semantic_acceptance.py --root . --check
      - run: python scripts/insight_acceptance.py --root . --check
      - run: python scripts/report_acceptance.py --root . --check
      - run: python scripts/automl_acceptance.py --root . --check
      - run: python scripts/ml_safety_acceptance.py --root . --check
      - run: python scripts/xai_acceptance.py --root . --check
      - run: python scripts/forecasting_anomaly_acceptance.py --root . --check
      - run: python scripts/typography_acceptance.py --root . --check
      - run: python scripts/collaboration_acceptance.py --root . --check
      - run: python scripts/governance_acceptance.py --root . --check
      - run: python scripts/entreprise_acceptance.py --root . --check
      - run: python scripts/hardening_acceptance.py --root . --check
      - run: python scripts/resilience_acceptance.py --root . --check
      - run: python scripts/sre_acceptance.py --root . --check
      - run: python scripts/sre_automation_acceptance.py --root . --check
      - run: python scripts/distributed_ops_acceptance.py --root . --check
      - run: python scripts/supply_chain_acceptance.py --root . --check
      - run: python scripts/runtime_security_acceptance.py --root . --check
      - run: python scripts/regulatory_compliance_acceptance.py --root . --check
      - run: python scripts/quality_remediation_acceptance.py --root . --check
      - run: python scripts/storytelling_acceptance.py --root . --check
      - run: python scripts/model_gateway_acceptance.py --root . --check
      - run: python scripts/i18n_accessibility_acceptance.py --root . --check
      - run: python scripts/cloud_cdc_acceptance.py --root . --check
      - run: python scripts/workspace_environment_acceptance.py --root . --check
      - run: python scripts/performance_slo_acceptance.py --root . --check
      - run: python scripts/cdc_gap_closure_acceptance.py --root . --check
      - run: python scripts/release_candidate_acceptance.py --root . --check
      - run: python scripts/release_installation_acceptance.py --root . --check
      - run: python scripts/security_documentation_acceptance.py --root . --check
      - run: python scripts/security_hardening_audit.py --root . --check
      - run: python scripts/production_acceptance.py --root . --check
      - run: python scripts/notebook_runtime_acceptance.py --root . --check
      - run: python scripts/catalog_lineage_acceptance.py --root . --check
      - run: python scripts/visual_analytics_acceptance.py --root . --check
      - run: python scripts/automl_unified_acceptance.py --root . --check
      - run: python scripts/deployment_policy_check.py --root . --check
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/datavision -f deploy/policy/ci-values.yaml
      - run: helm template datavision deploy/helm/datavision -f deploy/policy/ci-values.yaml > /tmp/datavision-rendered.yaml
      - run: docker run --rm -v /tmp:/work -v "$PWD/policies/kubernetes:/policy:ro" openpolicyagent/conftest:v0.56.0 test --policy /policy /work/datavision-rendered.yaml
      - run: docker compose config -q
      - run: docker compose build api web sandbox worker
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run typecheck && npm run build
      - name: Start release candidate stack
        run: docker compose up -d postgres redis sandbox api worker web
      - name: Wait for release candidate readiness
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3005/api/health >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color api web sandbox worker
          exit 1
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Release candidate E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3005
        run: |
          npm run test:e2e:smoke
          npm run test:e2e:mvp
          npm run test:e2e:production
          npm run test:e2e:accessibility
          npm run test:e2e:release-candidate
      - name: Release candidate load smoke
        run: python scripts/load_smoke.py --url http://127.0.0.1:3005/api/health --requests 120 --concurrency 12 --json-out /tmp/production-load.json
      - name: Stop release candidate stack
        if: always()
        run: docker compose down -v
      - run: python scripts/release.py --output dist
      - run: python scripts/verify_release.py dist/datavision-ai-v$(cat VERSION)-complet.zip --sha-file dist/datavision-ai-v$(cat VERSION)-complet.zip.sha256
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py requirements backend/requirements.txt -o dist/backend.cdx.json
      - working-directory: frontend
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file ../dist/frontend.cdx.json
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/source.spdx.json
      - run: python scripts/generate_provenance.py --root . --dist dist
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Sign release artifacts with keyless Sigstore
        shell: bash
        run: |
          for f in dist/datavision-ai-v$(cat VERSION)-complet.zip dist/datavision-ai-v$(cat VERSION)-complet.zip.sha256 dist/backend.cdx.json dist/frontend.cdx.json dist/source.spdx.json dist/sbom-index.json dist/provenance.intoto.json; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - uses: actions/attest@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: dist/datavision-ai-v*-complet.zip
      - name: Normalize GHCR image prefix
        if: startsWith(github.ref, 'refs/tags/')
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: startsWith(github.ref, 'refs/tags/')
      - name: Build and push signed API image
        if: startsWith(github.ref, 'refs/tags/')
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}/api:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - name: Build and push signed Web image
        if: startsWith(github.ref, 'refs/tags/')
        id: web-image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}/web:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - name: Build and push signed Sandbox image
        if: startsWith(github.ref, 'refs/tags/')
        id: sandbox-image
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          file: sandbox/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}/sandbox:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - name: Sign container image digests
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cosign sign --yes "${{ steps.image.outputs.prefix }}/api@${{ steps.api-image.outputs.digest }}"
          cosign sign --yes "${{ steps.image.outputs.prefix }}/web@${{ steps.web-image.outputs.digest }}"
          cosign sign --yes "${{ steps.image.outputs.prefix }}/sandbox@${{ steps.sandbox-image.outputs.digest }}"
      - uses: actions/upload-artifact@v4
        with:
          name: datavision-release
          path: dist/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
