name: Security

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm audit --audit-level=high

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  deployment-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: python scripts/deployment_policy_check.py --root . --check
      - run: helm template datavision deploy/helm/datavision -f deploy/policy/ci-values.yaml > /tmp/datavision-rendered.yaml
      - run: docker run --rm -v /tmp:/work -v "$PWD/policies/kubernetes:/policy:ro" openpolicyagent/conftest:v0.56.0 test --policy /policy /work/datavision-rendered.yaml

  security-evidence:
    runs-on: ubuntu-latest
    needs: [dependency-audit, filesystem-scan, deployment-policy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p production-evidence
      - run: python scripts/production_signoff.py record --evidence-dir production-evidence --kind security --status pass --source "github-actions-security:${{ github.run_id }}" --actor "${{ github.actor }}" --details "pip-audit, npm audit, Trivy and deployment policy passed"
      - uses: actions/upload-artifact@v4
        with:
          name: production-security-evidence
          path: production-evidence/security.json
