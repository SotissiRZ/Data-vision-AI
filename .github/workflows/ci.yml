name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python ../scripts/repository_hygiene.py --root .. --check
      - run: python ../scripts/production_baseline.py --root .. --check
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python ../scripts/mvp_acceptance.py --root .. --check
      - run: python ../scripts/preparation_acceptance.py --root .. --check
      - run: python ../scripts/workspace_acceptance.py --root .. --check
      - run: python ../scripts/assistant_acceptance.py --root .. --check
      - run: python ../scripts/assistant_window_acceptance.py --root .. --check
      - run: python ../scripts/assistant_multimodal_acceptance.py --root .. --check
      - run: python ../scripts/multi_agent_acceptance.py --root .. --check
      - run: python ../scripts/semantic_acceptance.py --root .. --check
      - run: python ../scripts/insight_acceptance.py --root .. --check
      - run: python ../scripts/report_acceptance.py --root .. --check
      - run: python ../scripts/automl_acceptance.py --root .. --check
      - run: python ../scripts/ml_safety_acceptance.py --root .. --check
      - run: python ../scripts/xai_acceptance.py --root .. --check
      - run: python ../scripts/forecasting_anomaly_acceptance.py --root .. --check
      - run: python ../scripts/typography_acceptance.py --root .. --check
      - run: python ../scripts/collaboration_acceptance.py --root .. --check
      - run: python ../scripts/governance_acceptance.py --root .. --check
      - run: python ../scripts/entreprise_acceptance.py --root .. --check
      - run: python ../scripts/hardening_acceptance.py --root .. --check
      - run: python ../scripts/resilience_acceptance.py --root .. --check
      - run: python ../scripts/sre_acceptance.py --root .. --check
      - run: python ../scripts/sre_automation_acceptance.py --root .. --check
      - run: python ../scripts/distributed_ops_acceptance.py --root .. --check
      - run: python ../scripts/cdc_audit.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose-config]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cp .env.example .env
      - run: docker compose up -d --build postgres redis sandbox api worker web
      - name: Wait for web readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3005/api/health >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color api web sandbox worker
          exit 1
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3005
        run: |
          npm run test:e2e:smoke
          npm run test:e2e:mvp
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
