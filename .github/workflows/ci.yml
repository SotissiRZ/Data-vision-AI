name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python ../scripts/repository_hygiene.py --root .. --check
      - run: python ../scripts/production_baseline.py --root .. --check
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python ../scripts/mvp_acceptance.py --root .. --check
      - run: python ../scripts/preparation_acceptance.py --root .. --check
      - run: python ../scripts/workspace_acceptance.py --root .. --check
      - run: python ../scripts/assistant_acceptance.py --root .. --check
      - run: python ../scripts/assistant_window_acceptance.py --root .. --check
      - run: python ../scripts/assistant_context_acceptance.py --root .. --check
      - run: python ../scripts/assistant_multimodal_acceptance.py --root .. --check
      - run: python ../scripts/multi_agent_acceptance.py --root .. --check
      - run: python ../scripts/semantic_acceptance.py --root .. --check
      - run: python ../scripts/insight_acceptance.py --root .. --check
      - run: python ../scripts/report_acceptance.py --root .. --check
      - run: python ../scripts/automl_acceptance.py --root .. --check
      - run: python ../scripts/ml_safety_acceptance.py --root .. --check
      - run: python ../scripts/xai_acceptance.py --root .. --check
      - run: python ../scripts/forecasting_anomaly_acceptance.py --root .. --check
      - run: python ../scripts/typography_acceptance.py --root .. --check
      - run: python ../scripts/collaboration_acceptance.py --root .. --check
      - run: python ../scripts/governance_acceptance.py --root .. --check
      - run: python ../scripts/entreprise_acceptance.py --root .. --check
      - run: python ../scripts/hardening_acceptance.py --root .. --check
      - run: python ../scripts/resilience_acceptance.py --root .. --check
      - run: python ../scripts/sre_acceptance.py --root .. --check
      - run: python ../scripts/sre_automation_acceptance.py --root .. --check
      - run: python ../scripts/distributed_ops_acceptance.py --root .. --check
      - run: python ../scripts/supply_chain_acceptance.py --root .. --check
      - run: python ../scripts/runtime_security_acceptance.py --root .. --check
      - run: python ../scripts/regulatory_compliance_acceptance.py --root .. --check
      - run: python ../scripts/production_acceptance.py --root .. --check
      - run: python ../scripts/notebook_runtime_acceptance.py --root .. --check
      - run: python ../scripts/catalog_lineage_acceptance.py --root .. --check
      - run: python ../scripts/visual_analytics_acceptance.py --root .. --check
      - run: python ../scripts/automl_unified_acceptance.py --root .. --check
      - run: python ../scripts/deployment_policy_check.py --root .. --check
      - run: python ../scripts/cdc_audit.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q

  deployment-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint deploy/helm/datavision -f deploy/policy/ci-values.yaml
      - name: Render Helm manifests
        run: helm template datavision deploy/helm/datavision -f deploy/policy/ci-values.yaml > /tmp/datavision-rendered.yaml
      - name: Evaluate Rego policy with Conftest
        run: docker run --rm -v /tmp:/work -v "$PWD/policies/kubernetes:/policy:ro" openpolicyagent/conftest:v0.56.0 test --policy /policy /work/datavision-rendered.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose-config, deployment-policy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cp .env.example .env
      - run: docker compose up -d --build postgres redis sandbox api worker web
      - name: Wait for web readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3005/api/health >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color api web sandbox worker
          exit 1
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3005
        run: |
          npm run test:e2e:smoke
          npm run test:e2e:mvp
          npm run test:e2e:production
      - name: Production HTTP load smoke
        run: python scripts/load_smoke.py --url http://127.0.0.1:3005/api/health --requests 100 --concurrency 10 --json-out production-load.json
      - name: Upload production load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-load
          path: production-load.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  production-evidence:
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose-config, deployment-policy, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: production-load
          path: production-evidence-artifacts
      - run: mkdir -p production-evidence
      - run: python scripts/production_signoff.py record --evidence-dir production-evidence --kind ci --status pass --source "github-actions:${{ github.run_id }}" --actor "${{ github.actor }}" --details "backend + frontend + CI acceptance jobs passed"
      - run: python scripts/production_signoff.py record --evidence-dir production-evidence --kind compose --status pass --source "github-actions:compose-config" --actor "${{ github.actor }}" --details "docker compose config and deployed compose E2E passed"
      - run: python scripts/production_signoff.py record --evidence-dir production-evidence --kind helm --status pass --source "github-actions:deployment-policy" --actor "${{ github.actor }}" --details "helm lint/template + Conftest passed"
      - run: python scripts/production_signoff.py record --evidence-dir production-evidence --kind e2e --status pass --source "github-actions:e2e" --actor "${{ github.actor }}" --details "Playwright smoke + MVP + production suites passed"
      - run: python scripts/production_signoff.py record --evidence-dir production-evidence --kind load --status pass --source "github-actions:e2e" --actor "${{ github.actor }}" --details "HTTP load smoke passed" --attachment production-evidence-artifacts/production-load.json
      - run: python scripts/production_signoff.py verify --evidence-dir production-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-evidence
          path: production-evidence
