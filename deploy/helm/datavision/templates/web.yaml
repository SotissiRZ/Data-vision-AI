apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datavision.fullname" . }}-web
spec:
  replicas: {{ .Values.replicas.web }}
  selector:
    matchLabels: {app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports: [{containerPort: 3005}]
          envFrom: [{configMapRef: {name: {{ include "datavision.fullname" . }}-config}}]
          readinessProbe: {httpGet: {path: /api/health, port: 3005}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "datavision.fullname" . }}-web
spec:
  type: {{ .Values.service.web.type }}
  selector: {app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.service.web.port }}, targetPort: 3005}]
