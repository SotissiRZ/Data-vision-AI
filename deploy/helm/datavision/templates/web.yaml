apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datavision.fullname" . }}-web
spec:
  replicas: {{ if .Values.autoscaling.web.enabled }}{{ .Values.autoscaling.web.minReplicas }}{{ else }}{{ .Values.replicas.web }}{{ end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.runtimeSecurity.podSecurityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.runtimeSecurity.podSecurityContext.runAsNonRoot }}
        seccompProfile: {type: {{ .Values.runtimeSecurity.podSecurityContext.seccompProfile }}}
      {{- end }}
      {{- if .Values.availability.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.availability.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.availability.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels: {app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }}}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          {{- if .Values.runtimeSecurity.containerSecurityContext.enabled }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.runtimeSecurity.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.runtimeSecurity.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ if .Values.runtimeSecurity.containerSecurityContext.dropAllCapabilities }}["ALL"]{{ else }}[]{{ end }}
          {{- end }}
          ports: [{containerPort: 3005}]
          envFrom: [{configMapRef: {name: {{ include "datavision.fullname" . }}-config}}]
          startupProbe:
            httpGet: {path: /api/health, port: 3005}
            periodSeconds: 5
            failureThreshold: {{ .Values.probes.web.startupFailureThreshold }}
          readinessProbe:
            httpGet: {path: /api/health, port: 3005}
            periodSeconds: 10
            failureThreshold: {{ .Values.probes.web.readinessFailureThreshold }}
          livenessProbe:
            httpGet: {path: /api/health, port: 3005}
            periodSeconds: 20
            failureThreshold: {{ .Values.probes.web.livenessFailureThreshold }}
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: next-cache, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "datavision.fullname" . }}-web
spec:
  type: {{ .Values.service.web.type }}
  selector: {app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.service.web.port }}, targetPort: 3005}]
