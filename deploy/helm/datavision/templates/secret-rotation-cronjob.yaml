{{- if .Values.operationalSecurity.secretRotation.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "datavision.fullname" . }}-secret-rotation
  labels:
    {{- include "datavision.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.operationalSecurity.secretRotation.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.operationalSecurity.secretRotation.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.operationalSecurity.secretRotation.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: secret-rotation
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          containers:
            - name: secret-rotation
              image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
              imagePullPolicy: {{ .Values.images.api.pullPolicy }}
              command: ["python", "-m", "app.ops.security", "rotate-secrets", "--actor-id", "system:secret-rotation", "--confirm"]
              envFrom:
                - configMapRef: {name: {{ include "datavision.fullname" . }}-config}
                - secretRef: {name: {{ include "datavision.secretName" . }}}
              resources:
                requests: {cpu: 50m, memory: 96Mi}
                limits: {cpu: 250m, memory: 256Mi}
{{- end }}
