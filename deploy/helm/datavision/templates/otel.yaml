apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "datavision.fullname" . }}-otel
  labels:
    {{- include "datavision.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: datavision-api
              metrics_path: /api/v1/metrics/internal
              authorization:
                type: Bearer
                credentials: ${env:OTEL_INTERNAL_METRICS_TOKEN}
              static_configs:
                - targets: ["{{ include "datavision.fullname" . }}-api:8005"]
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter: {check_interval: 5s, limit_mib: 256, spike_limit_mib: 64}
      batch: {timeout: 5s}
    exporters:
      prometheus: {endpoint: 0.0.0.0:9464, namespace: datavision}
      debug: {verbosity: basic}
      {{- if .Values.monitoring.tracing.externalOtlpHttpEnabled }}
      otlphttp/trace-backend:
        endpoint: {{ required "monitoring.tracing.externalOtlpHttpEndpoint is required when tracing export is enabled" .Values.monitoring.tracing.externalOtlpHttpEndpoint | quote }}
        tls:
          insecure: {{ .Values.monitoring.tracing.externalOtlpHttpInsecure }}
      {{- end }}
    service:
      pipelines:
        metrics:
          receivers: [prometheus, otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug{{ if .Values.monitoring.tracing.externalOtlpHttpEnabled }}, otlphttp/trace-backend{{ end }}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datavision.fullname" . }}-otel
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: otel, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: otel, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.runtimeSecurity.podSecurityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.runtimeSecurity.podSecurityContext.runAsNonRoot }}
        seccompProfile: {type: {{ .Values.runtimeSecurity.podSecurityContext.seccompProfile }}}
      {{- end }}
      containers:
        - name: otel-collector
          image: "{{ .Values.images.otelCollector.repository }}:{{ .Values.images.otelCollector.tag }}"
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          {{- if .Values.runtimeSecurity.containerSecurityContext.enabled }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.runtimeSecurity.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.runtimeSecurity.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ if .Values.runtimeSecurity.containerSecurityContext.dropAllCapabilities }}["ALL"]{{ else }}[]{{ end }}
          {{- end }}
          envFrom: [{secretRef: {name: {{ include "datavision.secretName" . }}}}]
          ports: [{containerPort: 4317}, {containerPort: 4318}, {containerPort: 9464}]
          volumeMounts: [{name: config, mountPath: /etc/otelcol-contrib, readOnly: true}]
          resources: {{- toYaml .Values.resources.otel | nindent 12 }}
      volumes: [{name: config, configMap: {name: {{ include "datavision.fullname" . }}-otel}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "datavision.fullname" . }}-otel
spec:
  selector: {app.kubernetes.io/component: otel, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: otlp-grpc, port: {{ .Values.service.otel.otlpGrpc }}, targetPort: 4317}
    - {name: otlp-http, port: {{ .Values.service.otel.otlpHttp }}, targetPort: 4318}
    - {name: prometheus, port: {{ .Values.service.otel.prometheus }}, targetPort: 9464}
