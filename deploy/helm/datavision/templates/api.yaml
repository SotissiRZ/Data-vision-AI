apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datavision.fullname" . }}-api
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels: {app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports: [{containerPort: 8005}]
          envFrom:
            - configMapRef: {name: {{ include "datavision.fullname" . }}-config}
            - secretRef: {name: {{ include "datavision.secretName" . }}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8005}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: 8005}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "datavision.fullname" . }}-data}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "datavision.fullname" . }}-api
spec:
  selector: {app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.service.api.port }}, targetPort: 8005}]
