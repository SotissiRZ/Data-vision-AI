{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "datavision.fullname" . }}-migrate-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "datavision.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["python", "-m", "app.ops.migrate", "apply", "--json"]
          env:
            - name: APP_ENV
              value: {{ .Values.config.appEnv | quote }}
            - name: DATABASE_URL
              value: {{ .Values.config.databaseUrl | quote }}
            - name: METADATA_FALLBACK_SQLITE
              value: "false"
            - name: SCHEMA_AUTO_MIGRATE
              value: "false"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
{{- end }}
