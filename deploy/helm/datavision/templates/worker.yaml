apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datavision.fullname" . }}-worker
spec:
  replicas: {{ .Values.replicas.worker }}
  selector:
    matchLabels: {app.kubernetes.io/component: worker, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: worker, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: {name: {{ include "datavision.fullname" . }}-config}
            - secretRef: {name: {{ include "datavision.secretName" . }}}
          resources: {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "datavision.fullname" . }}-data}
          {{- else }}
          emptyDir: {}
          {{- end }}
