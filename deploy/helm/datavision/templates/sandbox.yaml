apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datavision.fullname" . }}-sandbox
spec:
  replicas: {{ .Values.replicas.sandbox }}
  selector:
    matchLabels: {app.kubernetes.io/component: sandbox, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: sandbox, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: sandbox
          image: "{{ .Values.images.sandbox.repository }}:{{ .Values.images.sandbox.tag }}"
          imagePullPolicy: {{ .Values.images.sandbox.pullPolicy }}
          ports: [{containerPort: 8090}]
          env:
            - name: DATAVISION_KERNEL_MAX_SESSIONS
              value: {{ .Values.config.notebookKernelMaxSessions | quote }}
            - name: DATAVISION_KERNEL_TTL_SECONDS
              value: {{ .Values.config.notebookKernelTtlSeconds | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources: {{- toYaml .Values.resources.sandbox | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {medium: Memory, sizeLimit: 768Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "datavision.fullname" . }}-sandbox
spec:
  selector: {app.kubernetes.io/component: sandbox, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.service.sandbox.port }}, targetPort: 8090}]
