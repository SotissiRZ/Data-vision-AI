{{- if .Values.continuousCompliance.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "datavision.fullname" . }}-compliance-scan
  labels:
    {{- include "datavision.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.continuousCompliance.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.continuousCompliance.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.continuousCompliance.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: compliance-scan
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          {{- if .Values.runtimeSecurity.podSecurityContext.enabled }}
          securityContext:
            runAsNonRoot: {{ .Values.runtimeSecurity.podSecurityContext.runAsNonRoot }}
            seccompProfile: {type: {{ .Values.runtimeSecurity.podSecurityContext.seccompProfile }}}
          {{- end }}
          containers:
            - name: compliance
              image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
              imagePullPolicy: {{ .Values.images.api.pullPolicy }}
              command: ["python", "-m", "app.ops.compliance", "scan", "--all"]
              envFrom:
                - configMapRef: {name: {{ include "datavision.fullname" . }}-config}
                - secretRef: {name: {{ include "datavision.secretName" . }}}
              {{- if .Values.runtimeSecurity.containerSecurityContext.enabled }}
              securityContext:
                allowPrivilegeEscalation: {{ .Values.runtimeSecurity.containerSecurityContext.allowPrivilegeEscalation }}
                readOnlyRootFilesystem: {{ .Values.runtimeSecurity.containerSecurityContext.readOnlyRootFilesystem }}
                capabilities:
                  drop: {{ if .Values.runtimeSecurity.containerSecurityContext.dropAllCapabilities }}["ALL"]{{ else }}[]{{ end }}
              {{- end }}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              volumeMounts:
                - {name: data, mountPath: /app/data}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: data
              {{- if .Values.persistence.enabled }}
              persistentVolumeClaim: {claimName: {{ include "datavision.fullname" . }}-data}
              {{- else }}
              emptyDir: {}
              {{- end }}
            - {name: tmp, emptyDir: {}}
{{- end }}
