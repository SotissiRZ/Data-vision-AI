{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datavision.secretName" . }}
type: Opaque
stringData:
  AUTH_SECRET: {{ required "secrets.authSecret must be set" .Values.secrets.authSecret | quote }}
  CONNECTOR_SECRET_KEY: {{ required "secrets.connectorSecretKey must be set" .Values.secrets.connectorSecretKey | quote }}
  VAULT_TOKEN: {{ .Values.secrets.vaultToken | quote }}
  OTEL_INTERNAL_METRICS_TOKEN: {{ .Values.secrets.otelInternalMetricsToken | quote }}
  BACKUP_OBJECT_STORE_ACCESS_KEY: {{ .Values.secrets.backupObjectStoreAccessKey | quote }}
  BACKUP_OBJECT_STORE_SECRET_KEY: {{ .Values.secrets.backupObjectStoreSecretKey | quote }}
  BACKUP_OBJECT_STORE_SESSION_TOKEN: {{ .Values.secrets.backupObjectStoreSessionToken | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  MULTI_CLUSTER_FAILOVER_WEBHOOK_SECRET: {{ .Values.secrets.multiClusterFailoverWebhookSecret | quote }}
{{- end }}
