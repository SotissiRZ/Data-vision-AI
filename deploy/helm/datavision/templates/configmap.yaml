apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "datavision.fullname" . }}-config
  labels:
    {{- include "datavision.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  DEMO_ACCOUNT_ENABLED: {{ .Values.config.demoAccountEnabled | quote }}
  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  DEPLOYMENT_PROFILE: {{ .Values.config.deploymentProfile | quote }}
  EXTERNAL_EGRESS_POLICY: {{ .Values.config.externalEgressPolicy | quote }}
  NOTEBOOK_SANDBOX_URL: {{ .Values.config.notebookSandboxUrl | quote }}
  ANTIVIRUS_MODE: {{ .Values.config.antivirusMode | quote }}
  CLAMAV_HOST: {{ .Values.config.clamavHost | quote }}
  SECRET_KMS_PROVIDER: {{ .Values.config.secretKmsProvider | quote }}
  VAULT_ADDR: {{ .Values.config.vaultAddr | quote }}
  VAULT_TRANSIT_MOUNT: {{ .Values.config.vaultTransitMount | quote }}
  VAULT_TRANSIT_KEY: {{ .Values.config.vaultTransitKey | quote }}
  VAULT_TRANSIT_HSM_BACKED: {{ .Values.config.vaultTransitHsmBacked | quote }}
  SCHEMA_AUTO_MIGRATE: {{ .Values.config.schemaAutoMigrate | quote }}
  BACKUP_RETENTION_COUNT: {{ .Values.backup.retentionCount | quote }}
  BACKUP_REQUIRE_DATABASE_DUMP: {{ .Values.config.backupRequireDatabaseDump | quote }}
  BACKUP_OBJECT_STORE_PROVIDER: {{ .Values.config.backupObjectStoreProvider | quote }}
  BACKUP_OBJECT_STORE_ENDPOINT: {{ .Values.config.backupObjectStoreEndpoint | quote }}
  BACKUP_OBJECT_STORE_BUCKET: {{ .Values.config.backupObjectStoreBucket | quote }}
  BACKUP_OBJECT_STORE_PREFIX: {{ .Values.config.backupObjectStorePrefix | quote }}
  BACKUP_OBJECT_STORE_REGION: {{ .Values.config.backupObjectStoreRegion | quote }}
  BACKUP_OBJECT_STORE_VERIFY_TLS: {{ .Values.config.backupObjectStoreVerifyTls | quote }}
  BACKUP_OBJECT_STORE_AUTO_UPLOAD: {{ .Values.config.backupObjectStoreAutoUpload | quote }}
  SRE_QUEUE_ALERT_DEPTH: {{ .Values.config.sreQueueAlertDepth | quote }}
  SRE_BACKUP_MAX_AGE_HOURS: {{ .Values.config.sreBackupMaxAgeHours | quote }}
  SRE_RESTORE_DRILL_MAX_AGE_HOURS: {{ .Values.config.sreRestoreDrillMaxAgeHours | quote }}
  SRE_ERROR_BUDGET_BURN_ALERT: {{ .Values.config.sreErrorBudgetBurnAlert | quote }}
  SRE_AUTO_ALERTS_ENABLED: {{ .Values.config.sreAutoAlertsEnabled | quote }}
  SRE_CHECK_INTERVAL_SECONDS: {{ .Values.config.sreCheckIntervalSeconds | quote }}
  SRE_WORKER_AUTOSCALING_MODE: {{ .Values.autoscaling.worker.mode | quote }}
  SRE_CHAOS_ENABLED: {{ .Values.config.sreChaosEnabled | quote }}
  SRE_CHAOS_MAX_PROBE_JOBS: {{ .Values.config.sreChaosMaxProbeJobs | quote }}
  BACKUP_REPLICATION_TARGETS_JSON: {{ .Values.continuity.multiZoneBackup.targetsJson | quote }}
  BACKUP_REPLICATION_AUTO_ENABLED: {{ .Values.continuity.multiZoneBackup.enabled | quote }}
  SRE_DR_ENABLED: {{ .Values.continuity.drDrill.enabled | quote }}
  SRE_DR_ALLOWED_ENVS: {{ .Values.continuity.drDrill.allowedEnvs | quote }}
  SRE_DR_INCLUDE_DEPENDENCY_LOSS_CHECKS: {{ .Values.continuity.drDrill.includeDependencyLossChecks | quote }}
  MULTI_CLUSTER_SITES_JSON: {{ .Values.multiCluster.sitesJson | quote }}
  MULTI_CLUSTER_FAILOVER_ENABLED: {{ .Values.multiCluster.enabled | quote }}
  MULTI_CLUSTER_FAILOVER_EXECUTOR: {{ .Values.multiCluster.failoverExecutor | quote }}
  MULTI_CLUSTER_FAILOVER_WEBHOOK_URL: {{ .Values.multiCluster.failoverWebhookUrl | quote }}
  MULTI_CLUSTER_FAILOVER_WEBHOOK_TIMEOUT_SECONDS: {{ .Values.multiCluster.failoverWebhookTimeoutSeconds | quote }}
  MULTI_CLUSTER_CONFIRMATION_TTL_MINUTES: {{ .Values.multiCluster.confirmationTtlMinutes | quote }}
  MULTI_CLUSTER_REQUIRE_VERIFIED_BACKUP: {{ .Values.multiCluster.requireVerifiedBackup | quote }}
  MULTI_CLUSTER_BACKUP_MAX_AGE_HOURS: {{ .Values.multiCluster.backupMaxAgeHours | quote }}
  SECRET_AUTO_ROTATION_ENABLED: {{ .Values.operationalSecurity.secretRotation.enabled | quote }}
  SECRET_ROTATION_DEFAULT_DAYS: {{ .Values.operationalSecurity.secretRotation.defaultDays | quote }}
  SECRET_ROTATION_GENERATED_BYTES: {{ .Values.operationalSecurity.secretRotation.generatedBytes | quote }}
  RELEASE_ROLLBACK_ENABLED: {{ .Values.operationalSecurity.releaseRollback.enabled | quote }}
  RELEASE_ROLLBACK_EXECUTOR: {{ .Values.operationalSecurity.releaseRollback.executor | quote }}
  RELEASE_ROLLBACK_WEBHOOK_URL: {{ .Values.operationalSecurity.releaseRollback.webhookUrl | quote }}
  RELEASE_ROLLBACK_TIMEOUT_SECONDS: {{ .Values.operationalSecurity.releaseRollback.webhookTimeoutSeconds | quote }}
  RELEASE_ROLLBACK_CONFIRMATION_TTL_MINUTES: {{ .Values.operationalSecurity.releaseRollback.confirmationTtlMinutes | quote }}
  NEXT_PUBLIC_API_URL: "/api/backend"
  INTERNAL_API_URL: "http://{{ include "datavision.fullname" . }}-api:8005/api/v1"
  ADMISSION_VERIFY_IMAGES_ENABLED: {{ .Values.runtimeSecurity.admission.verifyImages | quote }}
  RUNTIME_SECURITY_SECCOMP_RUNTIME_DEFAULT: {{ eq .Values.runtimeSecurity.podSecurityContext.seccompProfile "RuntimeDefault" | quote }}
  RUNTIME_SECURITY_RUN_AS_NON_ROOT: {{ .Values.runtimeSecurity.podSecurityContext.runAsNonRoot | quote }}
  RUNTIME_SECURITY_READ_ONLY_ROOT_FILESYSTEM: {{ .Values.runtimeSecurity.containerSecurityContext.readOnlyRootFilesystem | quote }}
  RUNTIME_SECURITY_DROP_ALL_CAPABILITIES: {{ .Values.runtimeSecurity.containerSecurityContext.dropAllCapabilities | quote }}
  RUNTIME_SECURITY_DISALLOW_PRIVILEGE_ESCALATION: {{ not .Values.runtimeSecurity.containerSecurityContext.allowPrivilegeEscalation | quote }}
  RUNTIME_DETECTION_ENABLED: {{ .Values.runtimeSecurity.runtimeDetection.enabled | quote }}
  CONTINUOUS_COMPLIANCE_ENABLED: {{ .Values.continuousCompliance.enabled | quote }}
  CONTINUOUS_COMPLIANCE_SCHEDULE: {{ .Values.continuousCompliance.schedule | quote }}
